name: Build IBO Cleanroom APK

on:
  workflow_dispatch:
  push:
    branches: [ ibo-cleanroom-v1 ]
    paths:
      - 'ibo_cleanroom/**'
      - '.github/workflows/build-ibo-cleanroom.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: ibo_cleanroom
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp ibo_cleanroom/app/build/outputs/apk/debug/app-debug.apk XILI_TV_IBO_CLEANROOM_v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XILI-TV-IBO-CLEANROOM-v1
          path: XILI_TV_IBO_CLEANROOM_v1.apk
          if-no-files-found: error
