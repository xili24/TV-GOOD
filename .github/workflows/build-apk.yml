name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'project_chunks/**'
      - 'v2_patch_chunks/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base project
        run: |
          cat project_chunks/*.b64 | base64 -d > tvgood-project.zip
          mkdir source
          unzip -q tvgood-project.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply TV GOOD v2 patch
        run: |
          cat v2_patch_chunks/*.b64 | base64 -d | gzip -d > tvgood-v2.patch
          cd source
          set +e
          patch -p5 < ../tvgood-v2.patch
          PATCH_RC=$?
          set -e
          if [ "$PATCH_RC" -ne 0 ]; then
            echo "Patch returned $PATCH_RC; checking rejects..."
            find . -name '*.rej' -print
            if find . -name '*.rej' ! -path './README.md.rej' | grep -q .; then
              echo "Code patch reject detected"
              exit 1
            fi
            test -f README.md.rej
            rm -f README.md.rej
          fi
          test -f app/src/main/java/com/tvgood/app/ui/PlayerActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk TV_GOOD_v2_preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-GOOD-v2-preview
          path: TV_GOOD_v2_preview.apk
          if-no-files-found: error
