name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'smart_patch/**'
      - 'vertical_patch2/**'
      - 'performance_v5/**'
      - 'compact_menu_v6/**'
      - 'groups_v7/**'
      - 'xili_brand/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base project
        run: |
          cat project_chunks/*.b64 | base64 -d > tvgood-base.zip
          mkdir source
          unzip -q tvgood-base.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply Smart behavior v3 base
        run: |
          cat smart_patch/*.b64 | base64 -d | gzip -d > smart-v3.patch
          cd source
          patch -p1 < ../smart-v3.patch
          test -f app/src/main/java/com/tvgood/app/model/EpgNow.java
          grep -q '2.1.0-preview' app/build.gradle.kts

      - name: Apply uploaded-video vertical UI
        run: |
          cat vertical_patch2/*.b64 | base64 -d | gzip -d > vertical-v4.patch
          cd source
          patch -p1 < ../vertical-v4.patch
          grep -q '2.2.0-video-preview' app/build.gradle.kts
          grep -q 'PAGE_SIZE = 15' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'Favourite' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'Groups' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply performance v5
        run: |
          cat performance_v5/*.b64 | base64 -d | gzip -d > performance-v5.patch
          cd source
          patch -p1 < ../performance-v5.patch
          grep -q '2.3.0-performance-preview' app/build.gradle.kts
          grep -q 'epgDebounce' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'updateSelectionOnly' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply compact OK menu v6
        run: |
          cat compact_menu_v6/*.b64 | base64 -d | gzip -d > compact-menu-v6.patch
          cd source
          patch -p1 < ../compact-menu-v6.patch
          grep -q '2.4.0-compact-menu-preview' app/build.gradle.kts
          grep -q 'Ui.dp(this, 690), Ui.dp(this, 475)' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply Groups menu v7
        run: |
          cat groups_v7/*.b64 | base64 -d | gzip -d > groups-v7.patch
          cd source
          patch -p1 < ../groups-v7.patch
          grep -q '2.5.0-groups-preview' app/build.gradle.kts
          grep -q 'GROUP_PAGE_SIZE = 13' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'updateGroupScroll' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply Xili TV branding
        run: |
          mkdir -p source/app/src/main/res/drawable-nodpi
          base64 -d xili_brand/icon.b64 > source/app/src/main/res/drawable-nodpi/ic_xili_tv.png
          base64 -d xili_brand/banner.b64 > source/app/src/main/res/drawable-nodpi/xili_tv_banner.png
          sed -i 's#android:icon="@drawable/ic_tvgood"#android:icon="@drawable/ic_xili_tv"#' source/app/src/main/AndroidManifest.xml
          sed -i 's#android:banner="@drawable/tv_banner"#android:banner="@drawable/xili_tv_banner"#' source/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="TV GOOD"#android:label="@string/app_name"#' source/app/src/main/AndroidManifest.xml
          sed -i 's#<string name="app_name">TV GOOD</string>#<string name="app_name">Xili TV</string>#' source/app/src/main/res/values/strings.xml
          sed -i 's/"TV GOOD"/"Xili TV"/g' source/app/src/main/java/com/tvgood/app/ui/LoginActivity.java
          grep -q 'Xili TV' source/app/src/main/res/values/strings.xml
          test -s source/app/src/main/res/drawable-nodpi/ic_xili_tv.png
          test -s source/app/src/main/res/drawable-nodpi/xili_tv_banner.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk XILI_TV_GROUPS_v7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XILI-TV-GROUPS-v7
          path: XILI_TV_GROUPS_v7.apk
          if-no-files-found: error
