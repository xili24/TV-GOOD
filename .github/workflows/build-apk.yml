name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'smart_patch/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base project
        run: |
          cat project_chunks/*.b64 | base64 -d > tvgood-base.zip
          mkdir source
          unzip -q tvgood-base.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply Smart IPTV behavior patch
        run: |
          cat smart_patch/*.b64 | base64 -d | gzip -d > smart-v3.patch
          cd source
          patch -p1 < ../smart-v3.patch
          test -f app/src/main/java/com/tvgood/app/model/EpgNow.java
          grep -q '2.1.0-preview' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk TV_GOOD_SMART_STYLE_v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-GOOD-SMART-STYLE-v3
          path: TV_GOOD_SMART_STYLE_v3.apk
          if-no-files-found: error
