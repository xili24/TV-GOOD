name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'project_v2.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct TV GOOD v2
        run: |
          base64 -d project_v2.b64 > tvgood-v2.zip
          mkdir source
          unzip -q tvgood-v2.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          grep -q "2.0.0-preview1" source/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk TV_GOOD_v2_preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-GOOD-v2-Preview
          path: TV_GOOD_v2_preview.apk
          if-no-files-found: error
