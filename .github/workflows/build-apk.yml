name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'smart_patch/**'
      - 'vertical_patch2/**'
      - 'performance_v5/**'
      - 'compact_menu_v6/**'
      - 'groups_v7/**'
      - 'vod_v8/**'
      - 'vod_playback_v9/**'
      - 'live_stability_v10/**'
      - 'account_manager_v11/**'
      - 'fomo_brand_v12/**'
      - 'xili_brand/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base project
        run: |
          cat project_chunks/*.b64 | base64 -d > tvgood-base.zip
          mkdir source
          unzip -q tvgood-base.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply Smart behavior v3 base
        run: |
          cat smart_patch/*.b64 | base64 -d | gzip -d > smart-v3.patch
          cd source
          patch -p1 < ../smart-v3.patch
          test -f app/src/main/java/com/tvgood/app/model/EpgNow.java
          grep -q '2.1.0-preview' app/build.gradle.kts

      - name: Apply uploaded-video vertical UI
        run: |
          cat vertical_patch2/*.b64 | base64 -d | gzip -d > vertical-v4.patch
          cd source
          patch -p1 < ../vertical-v4.patch
          grep -q '2.2.0-video-preview' app/build.gradle.kts
          grep -q 'PAGE_SIZE = 15' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'Favourite' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'Groups' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply performance v5
        run: |
          cat performance_v5/*.b64 | base64 -d | gzip -d > performance-v5.patch
          cd source
          patch -p1 < ../performance-v5.patch
          grep -q '2.3.0-performance-preview' app/build.gradle.kts
          grep -q 'epgDebounce' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'updateSelectionOnly' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply compact OK menu v6
        run: |
          cat compact_menu_v6/*.b64 | base64 -d | gzip -d > compact-menu-v6.patch
          cd source
          patch -p1 < ../compact-menu-v6.patch
          grep -q '2.4.0-compact-menu-preview' app/build.gradle.kts
          grep -q 'Ui.dp(this, 690), Ui.dp(this, 475)' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply Groups menu v7
        run: |
          cat groups_v7/*.b64 | base64 -d | gzip -d > groups-v7.patch
          cd source
          patch -p1 < ../groups-v7.patch
          grep -q '2.5.0-groups-preview' app/build.gradle.kts
          grep -q 'GROUP_PAGE_SIZE = 13' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'updateGroupScroll' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply VOD movies v8
        run: |
          cat vod_v8/*.b64 | base64 -d | gzip -d > vod-v8.patch
          cd source
          patch -p1 < ../vod-v8.patch
          grep -q '2.6.0-vod-preview' app/build.gradle.kts
          grep -q 'vodCategories' app/src/main/java/com/tvgood/app/net/XtreamClient.java
          grep -q 'Movies / VOD' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          test -f app/src/main/java/com/tvgood/app/model/VodItem.java

      - name: Apply VOD playback v9
        run: |
          cat vod_playback_v9/*.b64 | base64 -d | gzip -d > vod-playback-v9.patch
          cd source
          patch -p1 < ../vod-playback-v9.patch
          grep -q '2.7.0-vod-playback-preview' app/build.gradle.kts
          grep -q 'vodPlaybackUrls' app/src/main/java/com/tvgood/app/net/XtreamClient.java
          grep -q 'urlCandidates' app/src/main/java/com/tvgood/app/ui/PlayerActivity.java

      - name: Apply live stability v10
        run: |
          cat live_stability_v10/*.b64 | base64 -d | gzip -d > live-stability-v10.patch
          cd source
          patch -p2 < ../live-stability-v10.patch
          grep -q '2.8.0-live-stability' app/build.gradle.kts
          grep -q 'livePlaybackUrls' app/src/main/java/com/tvgood/app/net/XtreamClient.java
          grep -q 'liveBufferWatchdog' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply account manager v11
        run: |
          cat account_manager_v11/*.b64 | base64 -d | gzip -d > account-manager-v11.patch
          cd source
          patch -p2 < ../account-manager-v11.patch
          grep -q '2.9.0-account-manager' app/build.gradle.kts
          grep -q 'SavedAccount' app/src/main/java/com/tvgood/app/util/SessionStore.java
          grep -q 'showAccountBlocked' app/src/main/java/com/tvgood/app/ui/HomeActivity.java
          grep -q 'Change Account' app/src/main/java/com/tvgood/app/ui/HomeActivity.java

      - name: Apply FOMO TV branding and splash v12
        run: |
          cat fomo_brand_v12/patch.b64 | base64 -d | gzip -d > fomo-v12.patch
          cd source
          patch -p3 < ../fomo-v12.patch || true
          sed -i 's#@drawable/ic_tvgood#@drawable/ic_fomo_tv#g; s#@drawable/ic_xili_tv#@drawable/ic_fomo_tv#g; s#@drawable/tv_banner#@drawable/fomo_tv_banner#g; s#@drawable/xili_tv_banner#@drawable/fomo_tv_banner#g' app/src/main/AndroidManifest.xml
          sed -i 's#<string name="app_name">TV GOOD</string>#<string name="app_name">FOMO TV</string>#; s#<string name="app_name">Xili TV</string>#<string name="app_name">FOMO TV</string>#' app/src/main/res/values/strings.xml
          sed -i 's/"TV GOOD"/"FOMO TV"/g; s/"Xili TV"/"FOMO TV"/g; s/"Simple. Fast. Television."/"Platforma jote për TV live, filma dhe argëtim."/g' app/src/main/java/com/tvgood/app/ui/LoginActivity.java
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d ../fomo_brand_v12/icon.b64 > app/src/main/res/drawable-nodpi/ic_fomo_tv.jpg
          base64 -d ../fomo_brand_v12/banner.b64 > app/src/main/res/drawable-nodpi/fomo_tv_banner.jpg
          base64 -d ../fomo_brand_v12/splash.b64 > app/src/main/res/drawable-nodpi/fomo_splash.jpg
          grep -q '3.0.0-fomo-splash' app/build.gradle.kts
          grep -q 'FOMO TV' app/src/main/res/values/strings.xml
          grep -q 'fomo_splash' app/src/main/java/com/tvgood/app/ui/LauncherActivity.java
          test -s app/src/main/res/drawable-nodpi/ic_fomo_tv.jpg
          test -s app/src/main/res/drawable-nodpi/fomo_tv_banner.jpg
          test -s app/src/main/res/drawable-nodpi/fomo_splash.jpg

      - name: Package final v12 source
        run: zip -qr FOMO_TV_V12_SOURCE.zip source

      - uses: actions/upload-artifact@v4
        with:
          name: FOMO-TV-V12-SOURCE
          path: FOMO_TV_V12_SOURCE.zip
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk FOMO_TV_v12_SPLASH.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FOMO-TV-v12-SPLASH
          path: FOMO_TV_v12_SPLASH.apk
          if-no-files-found: error
