name: Build TV GOOD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'project_chunks/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        run: |
          cat project_chunks/*.b64 | base64 -d > tvgood-project.zip
          mkdir source
          unzip -q tvgood-project.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk TV_GOOD_v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-GOOD-APK
          path: TV_GOOD_v1.0.apk
          if-no-files-found: error
